version: "3.9"

services:
  # PostgreSQL — primary data store for events, signals, entities
  postgres:
    image: postgres:16-alpine
    container_name: resonance-postgres
    environment:
      POSTGRES_USER: resonance
      POSTGRES_PASSWORD: resonance
      POSTGRES_DB: resonance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resonance"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis — Celery broker, result backend, and dedup cache
  redis:
    image: redis:7-alpine
    container_name: resonance-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
